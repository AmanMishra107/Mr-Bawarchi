<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c130e"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>

  <!-- Background circle with warm dark glow -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Royal Dum Handi (Pot) Base -->
  <path d="M19 36 C19 46 45 46 45 36 L43 33 L21 33 Z" fill="url(#goldGrad)"/>
  
  <!-- Handi Rim -->
  <rect x="18" y="31.5" width="28" height="3" rx="1.5" fill="#fef08a" stroke="#d97706" stroke-width="0.5"/>

  <!-- Handi Bottom Stand -->
  <path d="M26 44.5 L38 44.5 L36 47.5 L28 47.5 Z" fill="#b45309"/>

  <!-- Bawarchi Dum Flame & Steam Silhouette -->
  <!-- Outer flame -->
  <path d="M26 27 C26 19 32 13 32 11 C32 13 38 19 38 27 C38 30.5 35 31.5 32 31.5 C29 31.5 26 30.5 26 27 Z" fill="url(#fireGrad)"/>
  <!-- Inner core flame -->
  <path d="M28.5 26 C28.5 20.5 32 16 32 15 C32 16 35.5 20.5 35.5 26 C35.5 28.5 33.8 29.5 32 29.5 C30.2 29.5 28.5 28.5 28.5 26 Z" fill="#fffbeb"/>

  <!-- Aromatic Steam Swirls -->
  <path d="M21 26 C20 22 23 18 22 15" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M43 26 C44 22 41 18 42 15" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
